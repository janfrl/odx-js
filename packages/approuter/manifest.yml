applications:
  - name: odx-approuter
    memory: 128M
    disk_quota: 256M
    buildpacks:
      - nodejs_buildpack
    env:
      destinations: >
        [
          {
            "name": "odx-proxy-backend",
            "url": "((odx_proxy_url))",
            "forwardAuthToken": true
          },
          {
            "name": "odx-explorer-ui",
            "url": "((odx_explorer_url))",
            "forwardAuthToken": true
          }
        ]
    services:
      - ((xsuaa_service_name))
