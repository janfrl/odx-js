name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt workspaces
        run: pnpm dev:prepare

      - name: Verify workspace
        run: pnpm verify

      - name: Check generated artifact drift
        run: git diff --exit-code

      - name: Check out Nuxt Fiori contract consumer
        if: matrix.node-version == 24
        uses: actions/checkout@v5
        with:
          repository: me-tools/nuxt-fiori
          path: .integration/nuxt-fiori

      - name: Install Nuxt Fiori contract consumer
        if: matrix.node-version == 24
        working-directory: .integration/nuxt-fiori
        run: corepack pnpm@11.11.0 install --frozen-lockfile

      - name: Verify packed Nuxt Fiori consumer
        if: matrix.node-version == 24
        working-directory: .integration/nuxt-fiori
        run: corepack pnpm@11.11.0 verify:odx-consumer -- --odx-root "$GITHUB_WORKSPACE" --skip-build
